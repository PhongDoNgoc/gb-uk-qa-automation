trigger: none
pr: none

parameters:
- name: testPlan
  displayName: Azure Test Plan ID
  type: string
  default: '30985'
- name: testSuite
  displayName: Azure Test Suite ID
  type: string
  default: '31681'
- name: testConfiguration
  displayName: Azure Test Configuration ID
  type: string
  default: '188'
- name: targetEnvironment
  displayName: Target environment name
  type: string
  default: PROD
- name: agentPoolMode
  displayName: Agent pool mode
  type: string
  default: Auto
  values:
  - Auto
  - Hosted
  - SelfHosted
- name: selfHostedPoolName
  displayName: Self-hosted pool name
  type: string
  default: SelfHostedAP-Dev-NE-Swarm

variables:
  buildConfiguration: Release
  TEST_TARGET_ENV: ${{ parameters.targetEnvironment }}
  AZDO_ORG: endeco-technologies
  AZDO_PROJECT: 'Development Team'

jobs:
- ${{ if or(eq(parameters.agentPoolMode, 'SelfHosted'), and(eq(parameters.agentPoolMode, 'Auto'), ne(parameters.targetEnvironment, 'PROD'))) }}:
  - job: RunTestPlanOnSelfHosted
    displayName: Run Azure Test Plan on self-hosted agent
    pool:
      ${{ if eq(parameters.targetEnvironment, 'STAGE') }}:
        name: SelfHostedAP-Stg-NE-Swarm
      ${{ else }}:
        name: ${{ parameters.selfHostedPoolName }}
      demands:
      - Agent.OS -equals Linux
      - ${{ if eq(parameters.targetEnvironment, 'STAGE') }}:
        - Agent.Name -equals gbvmdsmanagersne01
      - ${{ else }}:
        - Agent.Name -equals gbvmdsmanagerdne01
    steps:
    - task: UseDotNet@2
      displayName: Use .NET 10 SDK
      inputs:
        packageType: sdk
        version: 10.0.x

    - task: DotNetCoreCLI@2
      displayName: Restore NuGet packages
      inputs:
        command: restore
        projects: QA.Regression.Automation/QA.Regression.Automation.csproj

    - task: Bash@3
      displayName: Install Playwright dependencies and Chromium
      inputs:
        targetType: inline
        script: |
          set -euo pipefail
          installer_project="tools/PlaywrightBrowserInstaller/PlaywrightBrowserInstaller.csproj"
          installer_dll="tools/PlaywrightBrowserInstaller/bin/$(buildConfiguration)/net10.0/PlaywrightBrowserInstaller.dll"
          dotnet build "$installer_project" --configuration "$(buildConfiguration)" --property:UseAppHost=false
          dotnet_path="$(command -v dotnet)"
          if ! command -v sudo >/dev/null 2>&1 || ! sudo -n true >/dev/null 2>&1; then
            echo "Passwordless sudo is required to install Chromium's Linux system dependencies."
            exit 1
          fi
          sudo -n "$dotnet_path" "$installer_dll" install-deps chromium
          dotnet "$installer_dll" install chromium

    - task: Bash@3
      displayName: Validate required test environment variables
      inputs:
        targetType: inline
        script: |
          set -euo pipefail
          selected_environment="$(printf '%s' "${TEST_TARGET_ENV:-}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | tr '[:lower:]' '[:upper:]')"
          if [[ -z "$selected_environment" ]]; then
            selected_environment=PROD
          fi

          required=(VIEWPOINT_USERNAME VIEWPOINT_PASSWORD VIEWPOINT_INVALID_PASSWORD "VIEWPOINT_BASE_URL_${selected_environment}")
          missing=()
          for name in "${required[@]}"; do
            value="${!name:-}"
            if [[ -z "$(printf '%s' "$value" | tr -d '[:space:]')" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            missing_list="$(printf '%s, ' "${missing[@]}")"
            missing_list="${missing_list%, }"
            printf 'Missing required environment variable(s) for test execution: %s\n' "$missing_list" >&2
            exit 1
          fi

          printf 'Validated required environment variables for TEST_TARGET_ENV=%s.\n' "$selected_environment"
      env:
        TEST_TARGET_ENV: $(TEST_TARGET_ENV)
        VIEWPOINT_USERNAME: $(VIEWPOINT_USERNAME)
        VIEWPOINT_PASSWORD: $(VIEWPOINT_PASSWORD)
        VIEWPOINT_INVALID_USERNAME: $(VIEWPOINT_INVALID_USERNAME)
        VIEWPOINT_INVALID_PASSWORD: $(VIEWPOINT_INVALID_PASSWORD)
        VIEWPOINT_BASE_URL_PROD: $(VIEWPOINT_BASE_URL_PROD)
        VIEWPOINT_BASE_URL_DEV: $(VIEWPOINT_BASE_URL_DEV)
        VIEWPOINT_BASE_URL_STAGE: $(VIEWPOINT_BASE_URL_STAGE)

    - task: Bash@3
      displayName: Generate and build Azure Test Plan cases
      inputs:
        targetType: inline
        script: |
          set -euo pipefail
          if [[ -z "${AZDO_PAT:-}" || "${AZDO_PAT:-}" == '$('* ]]; then
            echo "Azure pipeline secret variable AZDO_PAT is required for Test Plans API access."
            exit 1
          fi
          : "${AZDO_PLAN_ID:?Azure Test Plan ID is required.}"
          : "${AZDO_SUITE_ID:?Azure Test Suite ID is required.}"
          : "${AZDO_CONFIGURATION_ID:?Azure Test Configuration ID is required.}"

          if ! command -v python3 >/dev/null 2>&1; then
            if ! command -v sudo >/dev/null 2>&1 || ! sudo -n true >/dev/null 2>&1; then
              echo "Python 3 is required; passwordless sudo is unavailable to install it."
              exit 1
            fi
            sudo -n apt-get update
            sudo -n apt-get install -y python3 python3-venv
          fi

          if ! python3 -m venv .venv; then
            if ! command -v sudo >/dev/null 2>&1 || ! sudo -n true >/dev/null 2>&1; then
              echo "Python venv support is required; passwordless sudo is unavailable to install it."
              exit 1
            fi
            python_version="$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
            sudo -n apt-get update
            sudo -n apt-get install -y python3-venv "python${python_version}-venv"
            rm -rf -- .venv
            python3 -m venv .venv
          fi

          source .venv/bin/activate
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m unittest -b tests.test_test_plan_runner tests.test_generated_script_commit
          python main.py generate-scripts \
            --plan-id "$AZDO_PLAN_ID" \
            --suite-id "$AZDO_SUITE_ID" \
            --project-dir QA.Regression.Automation \
            --overwrite
          dotnet build QA.Regression.Automation/QA.Regression.Automation.csproj \
            --configuration "$BUILD_CONFIGURATION" --no-restore
      env:
        AZDO_ORG: $(AZDO_ORG)
        AZDO_PROJECT: $(AZDO_PROJECT)
        AZDO_PAT: $(AZDO_PAT)
        AZDO_PLAN_ID: ${{ parameters.testPlan }}
        AZDO_SUITE_ID: ${{ parameters.testSuite }}
        BUILD_CONFIGURATION: $(buildConfiguration)

    - task: Bash@3
      displayName: Commit generated tests to the source branch
      inputs:
        targetType: inline
        script: |
          set -euo pipefail
          source .venv/bin/activate
          python main.py commit-generated \
            --suite-id "$AZDO_SUITE_ID" \
            --project-dir QA.Regression.Automation
      env:
        GITHUB_PUSH_TOKEN: $(GITHUB_PUSH_TOKEN)
        BUILD_SOURCEBRANCH: $(Build.SourceBranch)
        AZDO_SUITE_ID: ${{ parameters.testSuite }}

    - task: Bash@3
      displayName: Associate and run Azure Test Plan cases
      inputs:
        targetType: inline
        script: |
          set -euo pipefail
          source .venv/bin/activate
          python main.py associate-scripts \
            --manifest "QA.Regression.Automation/Tests/Generated/Suite${AZDO_SUITE_ID}/automation-manifest.json" \
            --overwrite-association
          python main.py run-test-plan \
            --plan-id "$AZDO_PLAN_ID" \
            --suite-id "$AZDO_SUITE_ID" \
            --configuration-id "$AZDO_CONFIGURATION_ID" \
            --test-project QA.Regression.Automation/QA.Regression.Automation.csproj \
            --build-configuration "$BUILD_CONFIGURATION" \
            --results-directory "$RESULTS_DIRECTORY"
      env:
        AZDO_ORG: $(AZDO_ORG)
        AZDO_PROJECT: $(AZDO_PROJECT)
        AZDO_PAT: $(AZDO_PAT)
        AZDO_PLAN_ID: ${{ parameters.testPlan }}
        AZDO_SUITE_ID: ${{ parameters.testSuite }}
        AZDO_CONFIGURATION_ID: ${{ parameters.testConfiguration }}
        BUILD_CONFIGURATION: $(buildConfiguration)
        RESULTS_DIRECTORY: $(Agent.TempDirectory)/TestResults
        TEST_TARGET_ENV: $(TEST_TARGET_ENV)
        VIEWPOINT_USERNAME: $(VIEWPOINT_USERNAME)
        VIEWPOINT_PASSWORD: $(VIEWPOINT_PASSWORD)
        VIEWPOINT_INVALID_USERNAME: $(VIEWPOINT_INVALID_USERNAME)
        VIEWPOINT_INVALID_PASSWORD: $(VIEWPOINT_INVALID_PASSWORD)
        VIEWPOINT_BASE_URL_PROD: $(VIEWPOINT_BASE_URL_PROD)
        VIEWPOINT_BASE_URL_DEV: $(VIEWPOINT_BASE_URL_DEV)
        VIEWPOINT_BASE_URL_STAGE: $(VIEWPOINT_BASE_URL_STAGE)

    - task: PublishPipelineArtifact@1
      displayName: Retain original Test Plan evidence
      condition: always()
      inputs:
        targetPath: '$(Agent.TempDirectory)/TestResults'
        artifact: test-plan-evidence

    - task: PublishTestResults@2
      displayName: Publish NUnit test results
      condition: always()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: '**/*.trx'
        searchFolder: '$(Agent.TempDirectory)/TestResults'
        publishRunAttachments: true
        failTaskOnFailedTests: false

- ${{ else }}:
  - job: RunTestPlanOnHosted
    displayName: Run Azure Test Plan on hosted agent
    pool:
      vmImage: windows-latest
    steps:
    - task: UsePythonVersion@0
      displayName: Use Python 3
      inputs:
        versionSpec: '3.x'

    - task: PowerShell@2
      displayName: Fetch latest Test Plans cases and generate automation
      inputs:
        targetType: inline
        script: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:AZDO_PAT) -or $env:AZDO_PAT.StartsWith('$(')) {
            throw 'Azure pipeline secret variable AZDO_PAT is required for Test Plans API access.'
          }
          python -m pip install --disable-pip-version-check -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Installing Python dependencies failed.' }
          python main.py generate-scripts --plan-id "$env:AZDO_PLAN_ID" --suite-id "$env:AZDO_SUITE_ID" --project-dir QA.Regression.Automation --overwrite
          if ($LASTEXITCODE -ne 0) { throw 'Generating Test Plan scripts failed.' }
      env:
        AZDO_ORG: $(AZDO_ORG)
        AZDO_PROJECT: $(AZDO_PROJECT)
        AZDO_PAT: $(AZDO_PAT)
        AZDO_PLAN_ID: ${{ parameters.testPlan }}
        AZDO_SUITE_ID: ${{ parameters.testSuite }}

    - task: UseDotNet@2
      displayName: Use .NET 10 SDK
      inputs:
        packageType: sdk
        version: 10.0.x

    - task: DotNetCoreCLI@2
      displayName: Restore NuGet packages
      inputs:
        command: restore
        projects: QA.Regression.Automation/QA.Regression.Automation.csproj

    - task: DotNetCoreCLI@2
      displayName: Build test project
      inputs:
        command: build
        projects: QA.Regression.Automation/QA.Regression.Automation.csproj
        arguments: --configuration $(buildConfiguration) --no-restore

    - task: PowerShell@2
      displayName: Commit generated tests to the source branch
      inputs:
        targetType: inline
        script: |
          $ErrorActionPreference = 'Stop'
          python main.py commit-generated --suite-id "$env:AZDO_SUITE_ID" --project-dir QA.Regression.Automation
          if ($LASTEXITCODE -ne 0) { throw 'Committing generated Test Plan scripts failed.' }
      env:
        GITHUB_PUSH_TOKEN: $(GITHUB_PUSH_TOKEN)
        BUILD_SOURCEBRANCH: $(Build.SourceBranch)
        AZDO_SUITE_ID: ${{ parameters.testSuite }}

    - task: PowerShell@2
      displayName: Install Playwright browsers
      inputs:
        targetType: inline
        script: |
          & ./QA.Regression.Automation/bin/$(buildConfiguration)/net10.0/playwright.ps1 install

    - task: VisualStudioTestPlatformInstaller@1
      displayName: Install Visual Studio Test Platform
      inputs:
        packageFeedSelector: nugetOrg
        versionSelector: latestStable

    - task: PowerShell@2
      displayName: Validate required test environment variables
      inputs:
        targetType: inline
        script: |
          $required = @(
            'VIEWPOINT_USERNAME',
            'VIEWPOINT_PASSWORD',
            'VIEWPOINT_INVALID_PASSWORD'
          )

          $selectedEnvironment = if ([string]::IsNullOrWhiteSpace($env:TEST_TARGET_ENV)) { 'PROD' } else { $env:TEST_TARGET_ENV.Trim().ToUpperInvariant() }
          $required += "VIEWPOINT_BASE_URL_$selectedEnvironment"

          $missing = @()
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              $missing += $name
            }
          }

          if ($missing.Count -gt 0) {
            throw "Missing required environment variable(s) for test execution: $($missing -join ', ')"
          }

          Write-Host "Validated required environment variables for TEST_TARGET_ENV=$selectedEnvironment."
      env:
        TEST_TARGET_ENV: $(TEST_TARGET_ENV)
        VIEWPOINT_USERNAME: $(VIEWPOINT_USERNAME)
        VIEWPOINT_PASSWORD: $(VIEWPOINT_PASSWORD)
        VIEWPOINT_INVALID_USERNAME: $(VIEWPOINT_INVALID_USERNAME)
        VIEWPOINT_INVALID_PASSWORD: $(VIEWPOINT_INVALID_PASSWORD)
        VIEWPOINT_BASE_URL_PROD: $(VIEWPOINT_BASE_URL_PROD)
        VIEWPOINT_BASE_URL_DEV: $(VIEWPOINT_BASE_URL_DEV)
        VIEWPOINT_BASE_URL_STAGE: $(VIEWPOINT_BASE_URL_STAGE)

    - task: PowerShell@2
      displayName: Associate freshly built tests with Test Cases
      inputs:
        targetType: inline
        script: |
          $ErrorActionPreference = 'Stop'
          python main.py associate-scripts --manifest "QA.Regression.Automation/Tests/Generated/Suite$env:AZDO_SUITE_ID/automation-manifest.json" --overwrite-association
          if ($LASTEXITCODE -ne 0) { throw 'Associating Test Plan scripts failed.' }
      env:
        AZDO_ORG: $(AZDO_ORG)
        AZDO_PROJECT: $(AZDO_PROJECT)
        AZDO_PAT: $(AZDO_PAT)
        AZDO_SUITE_ID: ${{ parameters.testSuite }}

    - task: VSTest@3
      displayName: Run associated tests from Azure Test Plan
      inputs:
        testSelector: testPlan
        testPlan: ${{ parameters.testPlan }}
        testSuite: ${{ parameters.testSuite }}
        testConfiguration: ${{ parameters.testConfiguration }}
        searchFolder: '$(System.DefaultWorkingDirectory)/QA.Regression.Automation'
        uiTests: true
        vsTestVersion: toolsInstaller
        runInParallel: false
        publishRunAttachments: true
      env:
        TEST_TARGET_ENV: $(TEST_TARGET_ENV)
        VIEWPOINT_USERNAME: $(VIEWPOINT_USERNAME)
        VIEWPOINT_PASSWORD: $(VIEWPOINT_PASSWORD)
        VIEWPOINT_INVALID_USERNAME: $(VIEWPOINT_INVALID_USERNAME)
        VIEWPOINT_INVALID_PASSWORD: $(VIEWPOINT_INVALID_PASSWORD)
        VIEWPOINT_BASE_URL_PROD: $(VIEWPOINT_BASE_URL_PROD)
        VIEWPOINT_BASE_URL_DEV: $(VIEWPOINT_BASE_URL_DEV)
        VIEWPOINT_BASE_URL_STAGE: $(VIEWPOINT_BASE_URL_STAGE)
